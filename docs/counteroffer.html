<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dealz — Devis refusé</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .ao-wrap { max-width: 480px; margin: 60px auto; padding: 0 20px; }
    .ao-card { background: white; border: 1px solid var(--line); border-radius: 20px; padding: 26px; box-shadow: 0 20px 50px rgba(11,18,32,0.08); }
    .ao-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 14px 0 4px; }
    .ao-value { font-size: 14.5px; }
    .ao-quote { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-top: 6px; font-size: 13.5px; }
    .ao-quote .row { display: flex; justify-content: space-between; padding: 4px 0; align-items: center; }
    .ao-quote .row input[type="checkbox"] { margin-right: 8px; }
    .ao-quote .total { font-weight: 800; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
    .ao-input { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: inherit; font-size: 15px; margin-top: 6px; }
    .ao-textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: inherit; font-size: 13.5px; margin-top: 6px; min-height: 70px; resize: vertical; }
    .ao-btn { margin-top: 18px; width: 100%; background: linear-gradient(135deg, var(--blue), var(--blue-dark)); color: white; border: none; border-radius: 24px; padding: 12px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
    .ao-btn.secondary { margin-top: 8px; background: white; color: var(--muted); border: 1.5px solid var(--line); }
    .ao-btn:disabled { opacity: 0.5; }
    .ao-msg { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 13.5px; display: none; }
    .ao-msg.show { display: block; }
    .ao-msg.ok { background: var(--green-light); color: #0d6b4b; }
    .ao-msg.err { background: var(--red-light); color: var(--red-dark); }
    .ao-badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 20px; background: var(--blue-light); color: var(--blue-dark); margin-bottom: 6px; }
    .ao-email-preview { margin-top: 14px; background: white; border: 1.5px dashed var(--line); border-radius: 12px; overflow: hidden; font-size: 13px; }
    .ao-email-preview .aep-head { background: #fafbfd; color: var(--muted); padding: 8px 14px; font-weight: 700; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
    .ao-email-preview .aep-meta { padding: 10px 14px; border-bottom: 1px solid var(--line); line-height: 1.6; }
    .ao-email-preview .aep-body { padding: 12px 14px; }
    .ao-email-preview .aep-body table { width: 100%; border-collapse: collapse; }
  </style>
</head>
<body>
  <nav class="nav"><div class="nav-logo"><img src="/images/dealz-logo-sm.png" alt="Dealz" /></div></nav>

  <div class="ao-wrap">
    <div class="ao-card" id="ao-card">…</div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token");
    const card = document.getElementById("ao-card");

    function fmt(n) { return "CHF " + Number(n).toFixed(2); }

    // Same language as the decline e-mail that linked here (data.lang);
    // before it's known, the browser's language picks the error texts.
    const TXT = {
      fr: { invalid: "Lien invalide — aucun jeton fourni.", expired: "Ce lien n'est plus valide ou a expiré.", server: "<b>Cette page nécessite le serveur Dealz en ligne.</b><br/>Elle ne fonctionne pas en hébergement statique seul (ex. GitHub Pages sans backend).", declinedBy: "Devis refusé par", theCustomer: "le client", custMsg: "Message du client", original: "Devis original", error: "Erreur", preview: "📧 Aperçu de l'e-mail (démo)", to: "À :", subject: "Objet :", yourOffer: "Votre contre-offre (CHF)", eg: "ex.", optMsg: "Message (optionnel)", offerPh: "Nous pouvons vous faire ce prix exceptionnellement…", newDate: "Nouvelle date proposée", datePh: "ex. Lundi 8 septembre, 14h", datePh2: "Cette date vous conviendrait-elle ?", removeItems: "Cochez les prestations à retirer", revisePh: "Voici votre devis sans le nettoyage des vitres…", yourReply: "Votre réponse", replyPh: "Répondez à la question du client…", followupBtn: "Relancer maintenant", closeBtn: "Clôturer la demande", sendBtn: "Envoyer au client", suggested: "💬 Réponse suggérée — relisez et adaptez avant l'envoi", editSend: "✏️ Modifier et envoyer", okOffer: "✓ Contre-offre envoyée au client par e-mail.", okDate: "✓ Nouvelle date envoyée au client.", okRevise: "✓ Offre révisée envoyée au client.", okReply: "✓ Réponse envoyée au client.", okFollowup: "✓ Relance envoyée au client.", okClose: "✓ Demande clôturée.", okKeep: "✓ Prix maintenu — demande clôturée." },
      en: { invalid: "Invalid link — no token provided.", expired: "This link is no longer valid or has expired.", server: "<b>This page needs the Dealz server online.</b><br/>It doesn't work on static hosting alone (e.g. GitHub Pages without a backend).", declinedBy: "Quote declined by", theCustomer: "the customer", custMsg: "Customer's message", original: "Original quote", error: "Error", preview: "📧 Email preview (demo)", to: "To:", subject: "Subject:", yourOffer: "Your counter-offer (CHF)", eg: "e.g.", optMsg: "Message (optional)", offerPh: "We can exceptionally offer you this price…", newDate: "New date proposed", datePh: "e.g. Monday 8 September, 2pm", datePh2: "Would this date suit you?", removeItems: "Tick the services to remove", revisePh: "Here is your quote without the window cleaning…", yourReply: "Your reply", replyPh: "Answer the customer's question…", followupBtn: "Follow up now", closeBtn: "Close the request", sendBtn: "Send to the customer", suggested: "💬 Suggested reply — review and adapt before sending", editSend: "✏️ Edit and send", okOffer: "✓ Counter-offer emailed to the customer.", okDate: "✓ New date sent to the customer.", okRevise: "✓ Revised offer sent to the customer.", okReply: "✓ Reply sent to the customer.", okFollowup: "✓ Follow-up sent to the customer.", okClose: "✓ Request closed.", okKeep: "✓ Price kept — request closed." },
      de: { invalid: "Ungültiger Link — kein Token angegeben.", expired: "Dieser Link ist nicht mehr gültig oder abgelaufen.", server: "<b>Diese Seite benötigt den Dealz-Server online.</b><br/>Sie funktioniert nicht mit rein statischem Hosting (z. B. GitHub Pages ohne Backend).", declinedBy: "Offerte abgelehnt von", theCustomer: "dem Kunden", custMsg: "Nachricht des Kunden", original: "Ursprüngliche Offerte", error: "Fehler", preview: "📧 E-Mail-Vorschau (Demo)", to: "An:", subject: "Betreff:", yourOffer: "Ihr Gegenangebot (CHF)", eg: "z. B.", optMsg: "Nachricht (optional)", offerPh: "Wir können Ihnen diesen Preis ausnahmsweise anbieten…", newDate: "Neues vorgeschlagenes Datum", datePh: "z. B. Montag, 8. September, 14 Uhr", datePh2: "Würde Ihnen dieses Datum passen?", removeItems: "Kreuzen Sie die zu entfernenden Leistungen an", revisePh: "Hier Ihre Offerte ohne Fensterreinigung…", yourReply: "Ihre Antwort", replyPh: "Beantworten Sie die Frage des Kunden…", followupBtn: "Jetzt nachfassen", closeBtn: "Anfrage abschliessen", sendBtn: "An den Kunden senden", suggested: "💬 Vorgeschlagene Antwort — vor dem Senden prüfen und anpassen", editSend: "✏️ Bearbeiten und senden", okOffer: "✓ Gegenangebot per E-Mail an den Kunden gesendet.", okDate: "✓ Neues Datum an den Kunden gesendet.", okRevise: "✓ Überarbeitete Offerte an den Kunden gesendet.", okReply: "✓ Antwort an den Kunden gesendet.", okFollowup: "✓ Nachfassmail an den Kunden gesendet.", okClose: "✓ Anfrage abgeschlossen.", okKeep: "✓ Preis beibehalten — Anfrage abgeschlossen." },
    };
    let T = TXT[(navigator.language || "fr").slice(0, 2)] || TXT.fr;

    // rawText/suggestedReply/customer.name are customer-supplied free text
    // (the decline reason someone typed) — must be escaped before going
    // into innerHTML, or a customer could inject markup into a page the
    // business owner views.
    function escapeHtml(s) {
      return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function load() {
      if (!token) { card.innerHTML = `<p>${T.invalid}</p>`; return; }
      try {
        const res = await fetch(`/api/counteroffer/${token}`);
        if (!res.ok) {
          card.innerHTML = `<p>${T.expired}</p>`;
          return;
        }
        render(await res.json());
      } catch (e) {
        card.innerHTML = `<p>${T.server}</p>`;
      }
    }

    function contextHtml(data) {
      const itemsHtml = data.quote.items
        .map((i) => `<div class="row"><span>${escapeHtml(i.label)}</span><span>${fmt(i.amount)}</span></div>`)
        .join("");
      return `
        <span class="ao-badge">${data.emoji} ${data.categoryLabel}</span>
        <h2 style="margin:6px 0 4px;">${data.primaryCta}</h2>
        <p style="color:var(--muted); font-size:13.5px; margin:0 0 10px;">${T.declinedBy} ${escapeHtml(data.customer.name) || T.theCustomer}</p>
        ${data.rawText ? `<div class="ao-label">${T.custMsg}</div><div class="ao-value">« ${escapeHtml(data.rawText)} »</div>` : ""}
        ${data.showTotal ? `<div class="ao-label">${T.original}</div><div class="ao-quote">${itemsHtml}<div class="row total"><span>TOTAL</span><span>${fmt(data.quote.total)}</span></div></div>` : ""}
      `;
    }

    async function submit(btn, msgEl, body, successText) {
      btn.disabled = true;
      try {
        const res = await fetch(`/api/counteroffer/${token}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || T.error);
        msgEl.textContent = successText;
        msgEl.className = "ao-msg show ok";
        if (result.emailPreview) {
          const p = result.emailPreview;
          const preview = document.createElement("div");
          preview.className = "ao-email-preview";
          preview.innerHTML =
            `<div class="aep-head">${T.preview}</div>` +
            `<div class="aep-meta"><b>${T.to}</b> ${p.to}<br/><b>${T.subject}</b> ${p.subject}</div>` +
            `<div class="aep-body">${p.html}</div>`;
          msgEl.insertAdjacentElement("afterend", preview);
        }
      } catch (e) {
        msgEl.textContent = T.error + " : " + e.message;
        msgEl.className = "ao-msg show err";
        btn.disabled = false;
      }
    }

    function render(data) {
      T = TXT[data.lang] || TXT.fr;
      document.documentElement.lang = data.lang || "fr";
      let extraFields = "";
      if (data.action === "counteroffer") {
        extraFields = `
          <div class="ao-label">${T.yourOffer}</div>
          <input type="number" class="ao-input" id="ao-amount" placeholder="${T.eg} ${Math.round(data.quote.total * 0.9)}" />
          <div class="ao-label">${T.optMsg}</div>
          <textarea class="ao-textarea" id="ao-message" placeholder="${T.offerPh}"></textarea>
        `;
      } else if (data.action === "reschedule") {
        extraFields = `
          <div class="ao-label">${T.newDate}</div>
          <input type="text" class="ao-input" id="ao-date" placeholder="${T.datePh}" />
          <div class="ao-label">${T.optMsg}</div>
          <textarea class="ao-textarea" id="ao-message" placeholder="${T.datePh2}"></textarea>
        `;
      } else if (data.action === "revise") {
        const checks = data.quote.items
          .map(
            (i, idx) =>
              `<label class="row"><span><input type="checkbox" data-label="${i.label}" id="ao-item-${idx}" /> ${i.label}</span><span>${fmt(i.amount)}</span></label>`
          )
          .join("");
        extraFields = `
          <div class="ao-label">${T.removeItems}</div>
          <div class="ao-quote">${checks}</div>
          <div class="ao-label">${T.optMsg}</div>
          <textarea class="ao-textarea" id="ao-message" placeholder="${T.revisePh}"></textarea>
        `;
      } else if (data.action === "reply") {
        extraFields = `
          <div class="ao-label">${T.yourReply}</div>
          <textarea class="ao-textarea" id="ao-message" placeholder="${T.replyPh}"></textarea>
        `;
      }
      // followup / close / review: no extra fields, just the primary button.

      card.innerHTML = `
        ${contextHtml(data)}
        ${extraFields}
        <button class="ao-btn" id="ao-submit">${data.action === "followup" ? T.followupBtn : data.action === "close" || data.action === "review" ? T.closeBtn : T.sendBtn}</button>
        ${data.secondaryCta ? `<button class="ao-btn secondary" id="ao-secondary">${data.secondaryCta}</button>` : ""}
        <div class="ao-msg" id="ao-msg"></div>
        ${
          data.suggestedReply
            ? `
        <hr style="border:none; border-top:1px solid var(--line); margin:22px 0;" />
        <div class="ao-label">${T.suggested}</div>
        <textarea class="ao-textarea" id="ao-suggested-reply" style="min-height:110px;">${escapeHtml(data.suggestedReply)}</textarea>
        <button class="ao-btn secondary" id="ao-send-suggested">${T.editSend}</button>
        <div class="ao-msg" id="ao-suggested-msg"></div>
        `
            : ""
        }
      `;

      const msgEl = document.getElementById("ao-msg");
      const submitBtn = document.getElementById("ao-submit");

      submitBtn.addEventListener("click", () => {
        const message = document.getElementById("ao-message")?.value || "";

        if (data.action === "counteroffer") {
          const amountInput = document.getElementById("ao-amount");
          const amount = Number(amountInput.value);
          if (!amount || amount <= 0) return amountInput.focus();
          submit(submitBtn, msgEl, { amount, message }, T.okOffer);
        } else if (data.action === "reschedule") {
          const dateInput = document.getElementById("ao-date");
          if (!dateInput.value.trim()) return dateInput.focus();
          submit(submitBtn, msgEl, { date: dateInput.value.trim(), message }, T.okDate);
        } else if (data.action === "revise") {
          const removeItems = Array.from(document.querySelectorAll('[id^="ao-item-"]:checked')).map(
            (el) => el.dataset.label
          );
          submit(submitBtn, msgEl, { removeItems, message }, T.okRevise);
        } else if (data.action === "reply") {
          if (!message.trim()) return document.getElementById("ao-message").focus();
          submit(submitBtn, msgEl, { message }, T.okReply);
        } else if (data.action === "followup") {
          submit(submitBtn, msgEl, {}, T.okFollowup);
        } else {
          submit(submitBtn, msgEl, {}, T.okClose);
        }
      });

      const secondaryBtn = document.getElementById("ao-secondary");
      if (secondaryBtn) {
        secondaryBtn.addEventListener("click", () => {
          submit(secondaryBtn, msgEl, { action: "keep" }, T.okKeep);
          submitBtn.disabled = true;
        });
      }

      const sendSuggestedBtn = document.getElementById("ao-send-suggested");
      if (sendSuggestedBtn) {
        sendSuggestedBtn.addEventListener("click", () => {
          const replyText = document.getElementById("ao-suggested-reply").value.trim();
          if (!replyText) return document.getElementById("ao-suggested-reply").focus();
          submit(
            sendSuggestedBtn,
            document.getElementById("ao-suggested-msg"),
            { action: "send-reply", message: replyText },
            T.okReply
          );
        });
      }
    }

    load();
  </script>
</body>
</html>
