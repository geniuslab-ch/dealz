<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Devis en ligne</title>
<!--
  Standalone "separate window" destination for the Dealz quote flow — the
  counterpart to embed.js's floating chat bubble. Same conversation engine
  (quote-app.js), same visual language, just given a full page instead of a
  360px overlay. Opened either as a new browser tab/popup (window.open, see
  embed.js's data-dealz-mode="window") or linked to directly.

  Reads the tenant from ?company=slug in the URL — no build step, no
  server-side templating, works identically wherever it's hosted.

  ?embedded=1 — for a site with real code access that wants to iframe this
  directly into one of its own pages (below its own real navbar), rather
  than open it as a popup. Drops this page's own card chrome (shadow,
  centering, close button) and its "[Company] · Devis" mini-header, since
  the host page's own header already establishes whose site this is —
  showing both would be a redundant double-header.
-->
<style>
  :root{--dz-navy:#0b1220;--dz-blue:#0b5fff;--dz-blue-dark:#063fc7;--dz-sky-light:#eef6ff;
    --dz-green:#17a672;--dz-green-light:#e4f7ef;--dz-ink:#10131a;--dz-muted:#5b6472;--dz-line:#e4e9f2;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:#eef1f7;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
  }
  #dealz-window{
    width:100%;max-width:480px;height:100vh;max-height:760px;background:#fff;
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 20px 60px rgba(11,18,32,.18);
  }
  @media (min-width:540px){ #dealz-window{ border-radius:18px; margin:20px; height:calc(100vh - 40px); } }
  body.dz-embedded{background:#fff;}
  body.dz-embedded #dealz-window{max-width:none;max-height:none;box-shadow:none;}
  body.dz-embedded .dealz-embed-header{display:none;}
  @media (min-width:540px){ body.dz-embedded #dealz-window{ border-radius:0; margin:0; height:100vh; } }
  .dealz-embed-header{background:linear-gradient(120deg,var(--dz-blue),var(--dz-navy));color:#fff;
    padding:16px 18px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
  .dealz-embed-header .t{font-weight:bold;font-size:15px;}
  .dealz-embed-header .s{font-size:11.5px;color:#b9d6d5;}
  .dealz-embed-header button{background:none;border:none;color:#fff;font-size:19px;cursor:pointer;line-height:1;}
  .dealz-header-brand{display:flex;align-items:center;gap:10px;min-width:0;color:inherit;text-decoration:none;cursor:default;}
  .dealz-header-logo{width:36px;height:36px;border-radius:8px;object-fit:contain;background:#fff;flex-shrink:0;}
  .dealz-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fbfcff;}
  .dealz-messages>*{flex-shrink:0;}
  .dealz-msg{max-width:82%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;}
  .dealz-msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--dz-blue),var(--dz-blue-dark));color:#fff;border-bottom-right-radius:3px;}
  .dealz-msg.assistant{align-self:flex-start;background:var(--dz-sky-light);color:var(--dz-ink);border-bottom-left-radius:3px;}
  .dealz-msg.typing{align-self:flex-start;background:var(--dz-sky-light);color:var(--dz-muted);font-style:italic;}
  .dealz-msg.system-success{align-self:stretch;background:var(--dz-green-light);color:#0d6b4b;border:1px solid rgba(23,166,114,.3);}
  .dealz-msg.system-decline{align-self:stretch;background:#f3f4f6;color:var(--dz-muted);border:1px solid var(--dz-line);}
  .dealz-msg.system-success a,.dealz-msg.system-decline a{color:inherit;font-weight:700;}
  .dealz-quote-card{align-self:stretch;background:#fff;border:1.5px solid var(--dz-blue);border-radius:12px;overflow:hidden;font-size:13px;}
  .qc-head{background:linear-gradient(120deg,var(--dz-blue),var(--dz-navy));color:#fff;padding:8px 12px;font-weight:800;font-size:11px;letter-spacing:.04em;}
  .qc-row{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #f0f2f6;}
  .qc-total{display:flex;justify-content:space-between;padding:10px 12px;font-weight:800;background:var(--dz-sky-light);color:var(--dz-blue-dark);}
  .qc-actions{display:flex;gap:8px;padding:10px 12px;background:#fafbfd;}
  .qc-actions button{flex:1;border:none;border-radius:18px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .qc-accept{background:linear-gradient(135deg,var(--dz-green),#0d8f5f);color:#fff;}
  .qc-decline{background:#fff;color:var(--dz-muted);border:1.5px solid var(--dz-line)!important;}
  .qc-actions button:disabled{opacity:.45;cursor:default;}
  .dealz-email-preview{align-self:stretch;background:#fff;border:1.5px dashed var(--dz-line);border-radius:12px;overflow:hidden;font-size:12.5px;}
  .dealz-email-preview .dep-head{background:#fafbfd;color:var(--dz-muted);padding:7px 12px;font-weight:700;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--dz-line);}
  .dealz-email-preview .dep-meta{padding:9px 12px;border-bottom:1px solid var(--dz-line);color:var(--dz-ink);line-height:1.6;}
  .dealz-email-preview .dep-body{padding:11px 12px;color:var(--dz-ink);}
  .dealz-email-preview .dep-body table{width:100%;border-collapse:collapse;}
  .dealz-email-preview .dep-body td{padding:4px 0;font-size:12.5px;}
  .dealz-email-preview .dep-body h2{font-size:14px;margin:0 0 8px;}
  .dealz-email-preview .dep-body a{color:var(--dz-blue);}
  .dealz-objection-picker{align-self:stretch;display:flex;flex-direction:column;gap:8px;}
  .dop-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .dop-chip{border:1.5px solid var(--dz-line);background:#fff;border-radius:16px;padding:6px 11px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--dz-ink);font-family:inherit;}
  .dop-chip:disabled{opacity:.4;}
  .dop-chip.selected{border-color:var(--dz-blue);background:var(--dz-sky-light);color:var(--dz-blue-dark);font-weight:700;}
  .dop-free{display:flex;gap:6px;}
  .dop-free-input{flex:1;border:1.5px solid var(--dz-line);border-radius:16px;padding:7px 12px;font-size:12px;font-family:inherit;outline:none;}
  .dop-free-btn{background:var(--dz-navy);color:#fff;border:none;border-radius:16px;padding:0 14px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .dealz-contact-form{align-self:stretch;background:#fff;border:1px solid var(--dz-line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px;}
  .dcf-intro{font-size:12px;color:var(--dz-muted);margin:0 0 2px;font-weight:600;}
  .dcf-input{border:1.5px solid var(--dz-line);border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:inherit;outline:none;width:100%;}
  .dcf-submit{margin-top:2px;background:linear-gradient(135deg,var(--dz-blue),var(--dz-blue-dark));color:#fff;border:none;border-radius:16px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .dealz-inputbar{display:flex;gap:8px;padding:14px;border-top:1px solid var(--dz-line);background:#fff;flex-shrink:0;}
  .dealz-inputbar input{flex:1;border:1.5px solid var(--dz-line);border-radius:20px;padding:10px 14px;font-size:13.5px;font-family:inherit;outline:none;}
  .dealz-inputbar button{background:linear-gradient(135deg,var(--dz-blue),var(--dz-blue-dark));color:#fff;border:none;border-radius:20px;padding:0 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .dealz-inputbar button:disabled{opacity:.5;}
  .dealz-pdf-overlay{position:fixed;inset:0;background:rgba(11,18,32,.55);display:flex;align-items:center;justify-content:center;z-index:1000001;padding:20px;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}
  .dealz-pdf-modal{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4);}
  .dealz-pdf-modal-head{background:linear-gradient(120deg,var(--dz-blue),var(--dz-navy));color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;flex-shrink:0;}
  .dealz-pdf-modal-head button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;}
  .dealz-pdf-body{flex:1;min-height:280px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow-y:auto;}
  .dealz-pdf-loading{color:var(--dz-muted);font-size:13.5px;text-align:center;margin:40px 0;}
  .dealz-pdf-frame{width:100%;height:48vh;min-height:260px;border:1px solid var(--dz-line);border-radius:10px;}
  .dealz-pdf-download{font-size:13px;font-weight:700;color:var(--dz-blue-dark);text-decoration:none;}
  .dealz-pdf-actions{display:flex;gap:10px;padding:14px;border-top:1px solid var(--dz-line);flex-shrink:0;}
  .dealz-pdf-actions button{flex:1;padding:11px;font-size:14px;border-radius:22px;}
</style>
</head>
<body>
  <div id="dealz-window">
    <div class="dealz-embed-header" id="dealz-window-header">
      <a class="dealz-header-brand" id="dealz-window-brandlink" href="#" target="_blank" rel="noopener">
        <img id="dealz-window-logo" class="dealz-header-logo" alt="" style="display:none;" />
        <div><div class="t" id="dealz-window-title">Devis en ligne</div><div class="s">Réponse habituellement instantanée</div></div>
      </a>
      <button id="dealz-window-close" aria-label="Fermer">✕</button>
    </div>
    <div class="dealz-messages" id="dealz-messages"></div>
    <div class="dealz-inputbar">
      <input id="dealz-input" type="text" placeholder="Décrivez votre besoin de nettoyage…" autocomplete="off" />
      <button id="dealz-send">Envoyer</button>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(location.search);
    var company = params.get("company") || "";
    window.DEALZ_COMPANY = company;
    window.DEALZ_API_BASE = params.get("api-base") || location.origin;
    if (params.get("embedded") === "1") document.body.classList.add("dz-embedded");

    // Same T() dictionary as quote-app.js would use, kept tiny here since
    // this page only has a handful of its own static strings (the rest of
    // the conversation is quote-app.js's own, translated there).
    var lang = params.get("lang") || "fr";
    window.DEALZ_LANG = lang;
    var WINDOW_STRINGS = {
      en: {
        title: "Online quote",
        subtitle: "Usually replies instantly",
        placeholder: "Describe your cleaning needs…",
        send: "Send",
        close: "Close",
      },
      de: {
        title: "Online-Offerte",
        subtitle: "Antwort meist sofort",
        placeholder: "Beschreiben Sie Ihren Reinigungsbedarf…",
        send: "Senden",
        close: "Schliessen",
      },
    };
    if (WINDOW_STRINGS[lang]) {
      var s = WINDOW_STRINGS[lang];
      document.getElementById("dealz-window-title").textContent = s.title;
      document.querySelector("#dealz-window-header .s").textContent = s.subtitle;
      document.getElementById("dealz-input").placeholder = s.placeholder;
      document.getElementById("dealz-send").textContent = s.send;
      document.getElementById("dealz-window-close").setAttribute("aria-label", s.close);
      document.title = s.title;
    }

    // Closing a window only works if this page opened as a popup
    // (window.open) — if someone just navigated here directly there's
    // nothing to close, so send them back instead.
    document.getElementById("dealz-window-close").addEventListener("click", function () {
      window.close();
      setTimeout(function () {
        if (!window.closed && window.history.length > 1) window.history.back();
      }, 50);
    });

    // Header link only becomes clickable once/if a real website resolves —
    // no href-less "#" navigation for a company that hasn't set one.
    var brandLink = document.getElementById("dealz-window-brandlink");
    brandLink.addEventListener("click", function (e) {
      if (!brandLink.getAttribute("href") || brandLink.getAttribute("href") === "#") e.preventDefault();
    });

    // Turns "#RRGGBB" into a slightly darker shade for the header's
    // gradient end — same visual language as the default Dealz blue→navy
    // header, just built from the company's own brand color instead.
    function darken(hex, amount) {
      var m = /^#?([0-9a-f]{6})$/i.exec(hex);
      if (!m) return hex;
      var n = parseInt(m[1], 16);
      var r = Math.max(0, ((n >> 16) & 255) * (1 - amount));
      var g = Math.max(0, ((n >> 8) & 255) * (1 - amount));
      var b = Math.max(0, (n & 255) * (1 - amount));
      return "#" + [r, g, b].map(function (c) { return Math.round(c).toString(16).padStart(2, "0"); }).join("");
    }

    if (company) {
      fetch(window.DEALZ_API_BASE + "/api/company-info?company=" + encodeURIComponent(company))
        .then(function (r) { return r.json(); })
        .then(function (info) {
          if (!info) return;
          if (info.name) {
            var suffix = lang === "en" ? " · Quote" : lang === "de" ? " · Offerte" : " · Devis";
            document.getElementById("dealz-window-title").textContent = info.name + suffix;
            document.title = info.name + suffix;
          }
          if (info.logoUrl) {
            var logo = document.getElementById("dealz-window-logo");
            logo.src = info.logoUrl;
            logo.style.display = "block";
          }
          if (info.website) {
            brandLink.href = info.website;
            brandLink.style.cursor = "pointer";
          }
          if (info.brandColor && /^#[0-9a-f]{6}$/i.test(info.brandColor)) {
            document.getElementById("dealz-window-header").style.background =
              "linear-gradient(120deg," + info.brandColor + "," + darken(info.brandColor, 0.35) + ")";
          }
        })
        .catch(function () {});
    }
  </script>
  <script src="/pricing-engine-client.js"></script>
  <script src="/mock-client.js"></script>
  <script src="/quote-app.js"></script>
</body>
</html>
